<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#d3e9fb" />
    <title>역전 만루홈런!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 손그림 효과: 선을 아주 살짝 흔들어 손으로 그린 느낌을 내요 -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <defs>
        <filter id="hand" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="1" seed="3" result="warp" />
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <symbol id="cloud" viewBox="0 0 132 64">
          <path d="M22 56c-12 0-18-8-16-16 2-9 11-13 19-10 1-13 13-22 26-19 7-9 22-11 31-2 10-5 24 0 26 12 10-1 19 6 18 16-1 11-10 19-21 19z"
            fill="#ffffff" stroke="#2b3553" stroke-width="3" stroke-linejoin="round" />
          <path d="M30 44q8-6 16 0M74 30q8-5 15 1" fill="none" stroke="#bcd3ea" stroke-width="3" stroke-linecap="round" />
        </symbol>
      </defs>
    </svg>

    <!-- ───────────── 첫 화면: 야구장 ───────────── -->
    <header class="hero">
      <div class="hero__sky">
        <div class="clouds" aria-hidden="true">
          <svg class="cloud cloud--1" viewBox="0 0 132 64"><use href="#cloud" filter="url(#hand)" /></svg>
          <svg class="cloud cloud--2" viewBox="0 0 132 64"><use href="#cloud" filter="url(#hand)" /></svg>
          <svg class="cloud cloud--3" viewBox="0 0 132 64"><use href="#cloud" filter="url(#hand)" /></svg>
        </div>

        <div class="hero__copy">
          <p class="eyebrow eyebrow--sky" id="range"></p>
          <h1 class="hero__title" id="title">역전 만루홈런!</h1>
        </div>

        <!-- 조명탑, 관중석, 외야 펜스 -->
        <div class="park" aria-hidden="true">
          <svg class="tower tower--left" viewBox="-2 -2 44 100">
            <g filter="url(#hand)">
            <rect x="18" y="24" width="4" height="72" rx="2" fill="#9db9d4" stroke="#2b3553" stroke-width="2.6" />
            <rect x="2" y="2" width="36" height="24" rx="6" fill="#7f9fbe" stroke="#2b3553" stroke-width="3" />
            <g fill="#fff6c4">
              <circle cx="11" cy="10" r="3.2" /><circle cx="20" cy="10" r="3.2" /><circle cx="29" cy="10" r="3.2" />
              <circle cx="11" cy="18" r="3.2" /><circle cx="20" cy="18" r="3.2" /><circle cx="29" cy="18" r="3.2" />
            </g>
            </g>
          </svg>
          <svg class="tower tower--right" viewBox="-2 -2 44 100">
            <g filter="url(#hand)">
            <rect x="18" y="24" width="4" height="72" rx="2" fill="#9db9d4" stroke="#2b3553" stroke-width="2.6" />
            <rect x="2" y="2" width="36" height="24" rx="6" fill="#7f9fbe" stroke="#2b3553" stroke-width="3" />
            <g fill="#fff6c4">
              <circle cx="11" cy="10" r="3.2" /><circle cx="20" cy="10" r="3.2" /><circle cx="29" cy="10" r="3.2" />
              <circle cx="11" cy="18" r="3.2" /><circle cx="20" cy="18" r="3.2" /><circle cx="29" cy="18" r="3.2" />
            </g>
            </g>
          </svg>
          <div class="park__stands"></div>
          <div class="park__wall">
            <span class="park__marker">100</span>
          </div>
        </div>
      </div>

      <!-- 강아지와 너구리 얼굴: 하얗고 말랑한 찹쌀떡 얼굴, 연회색 연필 선 -->
      <svg class="buddies" viewBox="0 8 300 152" role="img" aria-label="나란히 있는 강아지와 너구리 얼굴">
        <path d="M60 151 C78 146 122 146 140 151 C122 156 78 156 60 151 Z" fill="#1f5f3f" opacity=".14" />
        <path d="M162 151 C180 146 232 146 250 151 C232 156 180 156 162 151 Z" fill="#1f5f3f" opacity=".14" />

        <g filter="url(#hand)">
          <!-- 강아지: 하얀 얼굴에 길게 늘어진 연갈색 귀 -->
          <g class="buddy buddy--dog">
            <g transform="rotate(4 100 110)">
              <path class="pen" d="M55 113 C53 87 76 72 100 73 C125 72 147 86 145 112 C147 133 128 144 100 143 C72 144 53 134 55 113 Z" fill="#fffdf8" />
              <path class="pen" d="M67 84 C50 81 41 98 44 117 C46 128 55 132 61 127 C68 121 69 104 73 92 C74 87 71 84 67 84 Z" fill="#ecd3b4" />
              <path class="pen" d="M133 84 C150 81 159 98 156 117 C154 128 145 132 139 127 C132 121 131 104 127 92 C126 87 129 84 133 84 Z" fill="#ecd3b4" />
              <ellipse cx="78" cy="122" rx="5.5" ry="2.8" fill="#f8c3cc" opacity=".7" />
              <ellipse cx="122" cy="122" rx="5.5" ry="2.8" fill="#f8c3cc" opacity=".7" />
              <ellipse cx="85" cy="114" rx="2.7" ry="3.7" fill="#2e2a31" />
              <ellipse cx="115" cy="114" rx="2.7" ry="3.7" fill="#2e2a31" />
              <path d="M95.5 119.5 C96.3 122.4 99.3 122.4 100 119.6 C100.7 122.4 103.7 122.4 104.5 119.5" fill="none" stroke="#4a4550" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </g>

          <!-- 너구리: 하얀 얼굴에 연회색 가면 무늬, 작고 동그란 귀 -->
          <g class="buddy buddy--raccoon">
            <g transform="translate(6 0) rotate(-3 200 110)">
              <g class="tail">
                <clipPath id="raccoon-tail">
                  <path d="M230 133 C246 137 262 125 266 107 C269 95 262 88 255 92 C248 100 240 112 226 118 Z" />
                </clipPath>
                <g clip-path="url(#raccoon-tail)">
                  <rect x="222" y="84" width="50" height="56" fill="#fffdf8" />
                  <path d="M229 107 L253 129 M237 98 L261 120 M245 89 L269 111" stroke="#bdb7bf" stroke-width="5.5" />
                </g>
                <path class="pen" d="M230 133 C246 137 262 125 266 107 C269 95 262 88 255 92 C248 100 240 112 226 118" fill="none" />
              </g>
              <path class="pen" d="M161 93 C152 83 154 68 165 67 C175 66 182 76 181 85 Z" fill="#fffdf8" />
              <path d="M164 87 C160 81 161 74 166 73.5 C171 73 175 78 174.5 83 Z" fill="#bdb7bf" />
              <path class="pen" d="M239 93 C248 83 246 68 235 67 C225 66 218 76 219 85 Z" fill="#fffdf8" />
              <path d="M236 87 C240 81 239 74 234 73.5 C229 73 225 78 225.5 83 Z" fill="#bdb7bf" />
              <path class="pen" d="M153 115 C151 88 174 74 200 75 C226 74 249 88 247 114 C249 135 229 145 200 144 C171 145 151 135 153 115 Z" fill="#fffdf8" />
              <path d="M161 113 C161 103 176 100 188 105 C194 107.5 206 107.5 212 105 C224 100 239 103 239 113 C239 122 225 125 212 121 C206 119 194 119 188 121 C175 125 161 122 161 113 Z" fill="#d6d1d7" />
              <!-- 이마 위 네잎클로버 -->
              <g transform="translate(200 81) rotate(-10)">
                <path d="M1 1 Q4 7 9 8" fill="none" stroke="#6fa877" stroke-width="1.8" stroke-linecap="round" />
                <path class="clover" d="M0 0 C-5 -3 -6.5 -9 -2.8 -10.2 C-1.2 -10.7 0 -9.6 0 -8.2 C0 -9.6 1.2 -10.7 2.8 -10.2 C6.5 -9 5 -3 0 0 Z" />
                <path class="clover" d="M0 0 C-5 -3 -6.5 -9 -2.8 -10.2 C-1.2 -10.7 0 -9.6 0 -8.2 C0 -9.6 1.2 -10.7 2.8 -10.2 C6.5 -9 5 -3 0 0 Z" transform="rotate(90)" />
                <path class="clover" d="M0 0 C-5 -3 -6.5 -9 -2.8 -10.2 C-1.2 -10.7 0 -9.6 0 -8.2 C0 -9.6 1.2 -10.7 2.8 -10.2 C6.5 -9 5 -3 0 0 Z" transform="rotate(180)" />
                <path class="clover" d="M0 0 C-5 -3 -6.5 -9 -2.8 -10.2 C-1.2 -10.7 0 -9.6 0 -8.2 C0 -9.6 1.2 -10.7 2.8 -10.2 C6.5 -9 5 -3 0 0 Z" transform="rotate(270)" />
              </g>
              <ellipse cx="222" cy="128" rx="5.5" ry="2.8" fill="#f8c3cc" opacity=".7" />
              <ellipse cx="178" cy="128" rx="5.5" ry="2.8" fill="#f8c3cc" opacity=".7" />
              <ellipse cx="184" cy="113" rx="2.8" ry="3.8" fill="#2e2a31" />
              <ellipse cx="216" cy="113" rx="2.8" ry="3.8" fill="#2e2a31" />
              <path d="M195.5 125 C196.3 127.9 199.3 127.9 200 125.1 C200.7 127.9 203.7 127.9 204.5 125" fill="none" stroke="#4a4550" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </g>
          </g>

          <g class="ball">
            <path class="pen" d="M140 34 C140 27 145 23 151 23 C158 23 162 28 162 34 C162 41 157 45 151 45 C144 45 140 40 140 34 Z" fill="#fff" />
            <path d="M144 27q5 7 0 14M158 27q-5 7 0 14" fill="none" stroke="#e5485f" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.6 2.6" />
          </g>
        </g>
      </svg>

      <!-- 전광판 -->
      <section class="board" aria-label="오늘의 기록">
        <dl class="board__stats">
          <div class="board__stat">
            <dt>오늘</dt>
            <dd id="stat-day">D+0</dd>
          </div>
          <div class="board__stat">
            <dt>100일까지</dt>
            <dd id="stat-left">0일</dd>
          </div>
          <div class="board__stat">
            <dt>만난 날</dt>
            <dd id="stat-meets">0번</dd>
          </div>
        </dl>
        <div class="board__progress">
          <div class="progress" role="progressbar" aria-label="100일까지 진행률"
            aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
            <span class="progress__fill" id="progress-fill"></span>
          </div>
          <span class="board__percent" id="progress-text">0%</span>
        </div>
      </section>
    </header>

    <!-- ───────────── 본문 ───────────── -->
    <main class="layout">
      <section class="card calendar" aria-labelledby="calendar-heading">
        <header class="card__head">
          <p class="eyebrow">Calendar</p>
          <h2 class="card__title" id="calendar-heading">우리가 만난 날</h2>
        </header>

        <div class="months" id="months" role="tablist" aria-label="달 선택"></div>

        <div class="weekdays" aria-hidden="true">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span
          ><span>금</span><span>토</span>
        </div>
        <div class="days" id="days"></div>

        <p class="legend">
          <span class="legend__item"><i class="dot dot--memory"></i>만난 날</span>
          <span class="legend__item"><i class="dot dot--hundred"></i>100일</span>
          <span class="legend__item"><i class="dot dot--today"></i>오늘</span>
        </p>
      </section>

      <section class="card memory" id="memory" aria-live="polite" tabindex="-1"
        aria-labelledby="memory-heading">
        <header class="card__head">
          <p class="eyebrow">Memory</p>
          <h2 class="card__title" id="memory-heading">그날의 기록</h2>
        </header>

        <div class="memory__empty" id="memory-empty">
          <svg class="memory__icon" viewBox="0 0 48 48" aria-hidden="true">
            <g filter="url(#hand)">
              <circle cx="24" cy="24" r="20" fill="#fff" stroke="#2b3553" stroke-width="3" />
              <path d="M12 12q8 12 0 24M36 12q-8 12 0 24" fill="none" stroke="#e5485f"
                stroke-width="3" stroke-linecap="round" stroke-dasharray="2 4" />
            </g>
          </svg>
          <p class="memory__hint">달력에서 초록색 날짜를 눌러 봐</p>
          <p class="memory__sub">그날 우리가 어디서 뭘 했는지 보여 줄게</p>
        </div>

        <article class="memory__body" id="memory-body" hidden>
          <div class="memory__meta">
            <span class="chip chip--blue" id="memory-order"></span>
            <span class="memory__day" id="memory-day"></span>
          </div>
          <h3 class="memory__title" id="memory-title"></h3>
          <p class="memory__note" id="memory-note"></p>
          <div class="photos" id="memory-photos"></div>

          <!-- 100일 편지: 봉투가 열리고 편지지가 올라와요 -->
          <div class="letter" id="letter" hidden>
            <button type="button" class="envelope" id="envelope" aria-expanded="false"
              aria-label="100일 편지 열기">
              <div class="letter__paper" id="letter-paper">
                <p class="letter__to" id="letter-to"></p>
                <p class="letter__text" id="letter-text"></p>
                <p class="letter__credit" id="letter-credit"></p>
                <p class="letter__from" id="letter-from"></p>
              </div>
              <svg class="envelope__front" viewBox="0 0 100 75" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0 L50 40 L100 0 L100 75 L0 75 Z" fill="#dceaff" />
                <path d="M0 75 L42 36 M100 75 L58 36" fill="none" stroke="#9fbde6" stroke-width="2.5"
                  vector-effect="non-scaling-stroke" stroke-linecap="round" />
                <path d="M0 0 L50 40 L100 0" fill="none" stroke="#2b3553" stroke-width="3"
                  vector-effect="non-scaling-stroke" stroke-linejoin="round" />
              </svg>
              <svg class="envelope__flap" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0 L50 56 L100 0 Z" fill="#c4dbfa" stroke="#2b3553" stroke-width="3"
                  vector-effect="non-scaling-stroke" stroke-linejoin="round" />
              </svg>
              <svg class="envelope__seal" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20.5 C5 15.5 2.5 12 2.5 8.6 C2.5 5.8 4.6 3.8 7.2 3.8 C9.2 3.8 10.9 5 12 6.7 C13.1 5 14.8 3.8 16.8 3.8 C19.4 3.8 21.5 5.8 21.5 8.6 C21.5 12 19 15.5 12 20.5 Z"
                  fill="#3d7fe6" stroke="#2b3553" stroke-width="1.6" stroke-linejoin="round" />
              </svg>
            </button>
            <p class="letter__hint" id="letter-hint">봉투를 눌러 봐</p>
          </div>

          <nav class="pager" aria-label="다른 날 보기">
            <button type="button" class="pager__btn" id="prev" aria-label="이전 만남">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" /></svg>
              <span>이전</span>
            </button>
            <span class="pager__count" id="pager-count"></span>
            <button type="button" class="pager__btn" id="next" aria-label="다음 만남">
              <span>다음</span>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5L13 10l-5.5 5.5" /></svg>
            </button>
          </nav>
        </article>
      </section>
    </main>

    <footer class="footer">
      <div class="footer__plate" aria-hidden="true">
        <span class="footer__box"></span>
        <span class="footer__home"></span>
        <span class="footer__box"></span>
      </div>
      <p class="footer__text">영우 &amp; 지민 · since 2026.08.17</p>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="사진 크게 보기">
      <img id="lightbox-img" alt="" />
      <button type="button" class="lightbox__close" id="lightbox-close">닫기</button>
    </dialog>

    <script src="memories.js"></script>
    <script src="script.js"></script>
  </body>
</html>
